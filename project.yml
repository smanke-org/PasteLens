# Source of truth for the Xcode project: run `xcodegen generate` after adding files or
# changing settings. PasteLensKit (Package.swift) holds the logic and its tests.
#
# Configurations:
#   Debug     Signed for development (CloudKit's Development environment), not sandboxed.
#   Release   GitHub build: archived, then exported for Developer ID by build_app.sh, which
#             has Xcode fetch the Developer ID provisioning profile CloudKit needs.
#   AppStore  Sandboxed, no updater (APPSTORE flag). Archive it from Xcode.
# All three sync through CloudKit (container iCloud.com.smanke.PasteLens), so the app is
# signed automatically with a provisioning profile. The helper tools need no profile.
name: PasteLens
options:
  bundleIdPrefix: com.smanke
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  PasteLensKit:
    path: .
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    DEVELOPMENT_TEAM: 32CWL275JJ
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      # Xcode otherwise adds get-task-allow, which notarization rejects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    AppStore:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
targets:
  PasteLens:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: PasteLensKit
      - sdk: AppIntents.framework
      - target: PasteLensCLI
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: PasteLensMCP
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smanke.PasteLens
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PasteLens.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/PasteLens-Debug.entitlements
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Resources/PasteLens-AppStore.entitlements
  # Target names differ from the product names: "pastelens" and "PasteLens" would share
  # build folders on a case-insensitive disk.
  PasteLensCLI:
    type: tool
    platform: macOS
    sources: [CLI]
    dependencies:
      - package: PasteLensKit
    settings:
      base:
        PRODUCT_NAME: pastelens
        PRODUCT_MODULE_NAME: PasteLensCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.smanke.PasteLens.cli
        CODE_SIGN_ENTITLEMENTS: Resources/Helper.entitlements
        SKIP_INSTALL: YES
  PasteLensMCP:
    type: tool
    platform: macOS
    sources: [MCP]
    dependencies:
      - package: PasteLensKit
    settings:
      base:
        PRODUCT_NAME: pastelens-mcp
        PRODUCT_MODULE_NAME: PasteLensMCP
        PRODUCT_BUNDLE_IDENTIFIER: com.smanke.PasteLens.mcp
        CODE_SIGN_ENTITLEMENTS: Resources/Helper.entitlements
        SKIP_INSTALL: YES
schemes:
  PasteLens:
    build:
      targets:
        PasteLens: all
    run:
      config: Debug
    archive:
      config: Release
